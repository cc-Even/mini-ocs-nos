name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check python
      - run: uv run --frozen pytest

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  runtime-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --wait redis
      - run: test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
      - if: always()
        run: docker compose down --volumes
