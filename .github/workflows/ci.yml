name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check python
      - run: mkdir -p artifacts/test-logs/python
      - name: Run Python tests
        run: |
          set -o pipefail
          uv run --frozen pytest 2>&1 | tee artifacts/test-logs/python/pytest.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-failure-logs
          path: artifacts/test-logs
          if-no-files-found: warn
          retention-days: 14

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: mkdir -p artifacts/test-logs/cpp
      - name: Run C++ tests
        run: |
          set -o pipefail
          ctest --preset dev 2>&1 | tee artifacts/test-logs/cpp/ctest.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-failure-logs
          path: artifacts/test-logs
          if-no-files-found: warn
          retention-days: 14

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/test-logs/sanitizer
      - name: Run C++ tests with ASan and UBSan
        run: |
          set -o pipefail
          make sanitizer-test 2>&1 | tee artifacts/test-logs/sanitizer/ctest.log
          make sanitizer-integration-test 2>&1 | tee artifacts/test-logs/sanitizer/integration.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-failure-logs
          path: artifacts/test-logs
          if-no-files-found: warn
          retention-days: 14

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Run Redis and service-process integration tests
        run: make redis-integration-test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-logs
          path: artifacts/test-logs
          if-no-files-found: warn
          retention-days: 14

  runtime-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/test-logs/runtime-foundation
      - name: Validate and start the Redis foundation
        run: |
          set -o pipefail
          {
            docker compose config --quiet
            docker compose up -d --wait redis
            test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          } 2>&1 | tee artifacts/test-logs/runtime-foundation/acceptance.log
      - if: always()
        run: docker compose logs --no-color > artifacts/test-logs/runtime-foundation/redis.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-foundation-failure-logs
          path: artifacts/test-logs
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose down --volumes
